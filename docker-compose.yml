services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: backend-dev
    container_name: backend-dev
    # Variáveis (DATABASE_USER, DATABASE_PASSWORD, DATABASE_HOST, TOKEN_SECRET, MAILER_*)
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      # Código-fonte em hot reload
      - .:/app
      # Mantém o node_modules do container (não sobrescreve com o do host)
      - node_modules:/app/node_modules
    command: yarn run dev

volumes:
  node_modules: